name: Build RadVpn APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Point to Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build hev-socks5-tunnel
        run: bash compile-hevtun.sh
      - name: Place hev-socks5-tunnel libs into the app
        run: |
          echo "--- all hev libs found ---"
          find . -name 'libhev-socks5-tunnel.so' | sort
          n=0
          for f in $(find . -name 'libhev-socks5-tunnel.so' -not -path './V2rayNG/*'); do
            abi=$(basename "$(dirname "$f")")
            case "$abi" in
              armeabi-v7a|arm64-v8a|x86|x86_64)
                mkdir -p "V2rayNG/app/src/main/jniLibs/$abi"
                cp "$f" "V2rayNG/app/src/main/jniLibs/$abi/"
                n=$((n+1));;
            esac
          done
          echo "copied $n libs"
          test "$n" -gt 0
      - name: Build Xray core (libv2ray.aar)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd AndroidLibXrayLite
          gomobile init
          go mod tidy -v
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o libv2ray.aar ./
          mkdir -p ../V2rayNG/app/libs
          cp libv2ray.aar ../V2rayNG/app/libs/

      - name: Build APK (debug-signed, fine for personal installs)
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadVpn-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
